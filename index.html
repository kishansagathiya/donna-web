<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Donna is the voice-first AI assistant built for founders — capture context as it happens, remember what matters, and follow through."
    />
    <title>Donna — AI assistant for founders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (q.get("desktop") === "1" || q.get("desktop_handoff") === "1") {
            var port = q.get("handoff_port") || "";
            var nonce = q.get("handoff_nonce") || "";
            var payload = JSON.stringify({
              t: Date.now(),
              port: port || undefined,
              nonce: nonce || undefined,
            });
            var secure = location.protocol === "https:" ? "; Secure" : "";
            document.cookie =
              "donna_desktop_handoff=" +
              encodeURIComponent("1|" + port + "|" + nonce) +
              "; Max-Age=900; Path=/; SameSite=Lax" +
              secure;
            sessionStorage.setItem("donna.desktop_handoff.v1", payload);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
